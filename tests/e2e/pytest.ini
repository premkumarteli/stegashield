[pytest]
minversion = 8.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = ../.. ../../backend .
markers =
    tier1: Tier 1 happy-path isolated feature coverage tests
    tier2: Tier 2 boundary and corner case tests
    tier3: Tier 3 cross-feature and pairwise combinatorial tests
    tier4: Tier 4 real-world operational and academic scenario tests
    slow: Tests requiring significant compute (e.g. 16MP images or large sweeps)
    crypto: Cryptographic scrypt, HKDF, and AES-256-GCM tests
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
